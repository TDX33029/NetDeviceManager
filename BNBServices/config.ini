# Chat ID（从 @userinfobot 获取，或发送消息给bot后从API获取）
chat_id = 7775553661

[monitor]
# BTC/USDT 价格上限阈值（超过此价格发送警报），设为 0 禁用
upper_threshold = 70000
# BTC/USDT 价格下限阈值（低于此价格发送警报），设为 0 禁用
lower_threshold = 50000
# 检查间隔（秒），建议不小于 10 秒以避免API限频
check_interval = 10
# 警报冷却时间（秒），同一方向警报的最小间隔，防止重复通知
alert_cooldown = 3600

[api]
# Binance API 基础URL
base_url = https://data-api.binance.vision
# 请求超时时间（秒）
timeout = 15
